<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>docagent - step03 tool calling</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-height: 200px; white-space: pre-wrap; }
  .event { margin: 0.25rem 0; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.9rem; }
  .status { color: #666; }
  .tool_call { background: #eef; }
  .tool_result_ok { background: #efe; }
  .tool_result_fail { background: #fee; }
  .token { font-weight: bold; }
  .done { color: #888; font-style: italic; }
  form { margin-top: 1rem; display: flex; gap: 0.5rem; }
  input[type=text] { flex: 1; padding: 0.5rem; }
</style>
</head>
<body>
  <h1>docagent — 매출 분석 에이전트 (3단계)</h1>
  <div id="log"></div>
  <form id="chat-form">
    <input type="text" id="message" placeholder="예: 2분기 노트북 서울 매출 합계 알려줘" autocomplete="off" />
    <button type="submit">보내기</button>
  </form>
  <script src="./app.js"></script>
</body>
</html>
