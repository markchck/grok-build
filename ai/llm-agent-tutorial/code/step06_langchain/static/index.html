<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>docagent - 하이브리드 검색 RAG</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  #answer { white-space: pre-wrap; border: 1px solid #ddd; border-radius: 8px; padding: 16px; min-height: 80px; }
  #status { color: #666; font-size: 13px; min-height: 18px; }
  #sources { margin-top: 12px; font-size: 14px; }
  #sources a { display: block; margin: 4px 0; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 8px; }
  select, button { padding: 8px; }
</style>
</head>
<body>
  <h1>docagent - 하이브리드 검색 RAG</h1>
  <form id="chat-form">
    <input type="text" id="message" placeholder="예: 2분기 매출이 하락한 원인은?" required />
    <select id="search-mode">
      <option value="hybrid" selected>hybrid</option>
      <option value="dense">dense</option>
      <option value="sparse">sparse</option>
    </select>
    <button type="submit">질문</button>
  </form>
  <div id="status"></div>
  <div id="answer"></div>
  <div id="sources"></div>

  <script src="/static/app.js"></script>
</body>
</html>
